plugins {
	id 'fabric-loom' version "${loom_version}"
	id 'maven-publish'
}

version = project.mod_version
group = project.mod_group_id

base {
	archivesName = project.mod_id
}

repositories {
	mavenCentral()
	maven { url = "https://maven.fabricmc.net" }
	maven { url = "https://maven.parchmentmc.org" }
	maven { url = "https://repo.spongepowered.org/repository/maven-public/" }
	maven { url = "https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/" }
	maven { url = "https://maven.kosmx.dev/" }
	maven { url = "https://maven.blamejared.com" }
	maven { url = "https://maven.theillusivec4.top" }
	maven { url = "https://maven.modrinth.com" }
	flatDir { dir 'libs' }
}

loom {
	mods {
		"irons_spellbooks" {
			sourceSet sourceSets.main
		}
	}

	accessWidenerPath = file("src/main/resources/irons_spellbooks.accesswidener")
	mixin {
		defaultRefmapName = 'irons_spellbooks.refmap.json'
	}
}

dependencies {
	// Minecraft + Parchment Mappings
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.layered() {
		officialMojangMappings()
		parchment("org.parchmentmc.data:parchment-1.20.1:2023.09.03@zip")
	}
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"
	compileOnly "com.google.code.findbugs:jsr305:3.0.2"

	// JEI (Fabric)
	modCompileOnlyApi "mezz.jei:jei-1.20.1-fabric-api:15.3.0.4"

	// GeckoLib (Fabric)
	modImplementation "software.bernie.geckolib:geckolib-fabric-${project.minecraft_version}:${project.geckolib_version}"

	// Player Animator (Fabric)
	modImplementation "dev.kosmx.player-anim:player-animation-lib-fabric:${project.player_animator_version}"
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

processResources {
	def version = project.version
	inputs.property "version", version

	filesMatching("fabric.mod.json") {
		expand "version": version
	}

	// Copy player animations to animations folder in build output without modifying src/
	from("src/main/resources/assets/${project.mod_id}/player_animation") {
		include 'casting_animations.json'
		into "assets/${project.mod_id}/animations"
	}

	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
	filteringCharset = "UTF-8"
}

tasks.withType(Copy).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(Jar).configureEach {
	duplicatesStrategy = DuplicatesStrategy.EXCLUDE
}

tasks.withType(JavaCompile).configureEach {
	options.encoding = "UTF-8"
	options.release = 17
}

java {
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_17
	targetCompatibility = JavaVersion.VERSION_17
}

jar {
	def projectName = project.name
	inputs.property "projectName", projectName

	from(file("LICENSE.md")) {
		rename { "${it}_$projectName"}
	}

	exclude('**/*.psd')
	exclude('**/*.bbmodel')
	exclude('META-INF/mods.toml')
	exclude('META-INF/accesstransformer.cfg')
}

// Configure maven publication
publishing {
	publications {
		create("mavenJava", MavenPublication) {
			from components.java
		}
	}

	repositories {
		// Add repositories to publish to here if needed.
	}
}